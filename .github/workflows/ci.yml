name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Design rules (hex colors, *Brand, secrets)
        run: bash scripts/check-design-rules.sh
      - name: ktlint, lint, unit tests, both flavors
        run: ./gradlew ktlintCheck lintDevDebug lintProdDebug testDevDebugUnitTest testProdDebugUnitTest assembleDevDebug assembleProdDebug --stacktrace
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: app/build/reports
